spec:
  name: dm-conversation-lifecycle
  tier: 1
  modules: [dm, auth, profile]
  intent: >
    Two parents find each other in the member directory, exchange messages,
    and the whole social contract holds: one canonical conversation per pair,
    unread counts that move with reads, block flipping sends to 403, report
    reaching the founder, an outsider seeing nothing but 404s, and account
    deletion removing the thread from BOTH inboxes. This is the first
    user-to-user surface in the app — the isolation properties matter more
    than the happy path.

  personas:
    alice:
      preset: new-parent
    bob:
      preset: new-parent
    mallory:
      preset: new-parent

  preconditions:
    - "Backend is reachable at $BASE_URL/health"

  invariants:
    - "Both parents appear in each other's /dm/members (self excluded)"
    - "Starting A→B and B→A yields the SAME conversation id (canonical pair)"
    - "A send bumps the peer's unread count; reading zeroes it; the sender's
       own messages are never unread to them"
    - "The inbox denormalizes the last message preview"
    - "A non-participant gets 404 on every conversation path (never 403 —
       existence is not confirmed)"
    - "Block (by either side) makes sends 403; unblock restores"
    - "Report returns ok (email dispatch is best-effort server-side)"
    - "DELETE /family on one participant removes the thread from the OTHER
       participant's inbox too"

  boundary_contracts:
    - endpoint: GET /dm/members
      as: alice
      status: 200
      response_includes: [members]

    - endpoint: POST /dm/conversations
      as: alice
      status: 200
      response_includes: [id, peer_id, peer_name]

    - endpoint: POST /dm/conversations/{conversation_id}/messages
      as: alice
      status: 200
      response_includes: [id, sender_id, body, created_at]

    - endpoint: GET /dm/conversations
      as: bob
      status: 200
      response_includes: [conversations, total_unread]

    - endpoint: GET /dm/conversations/{conversation_id}/messages
      as: mallory
      status: 404

    - endpoint: POST /dm/conversations/{conversation_id}/report
      as: alice
      status: 200
      response_includes: [ok]
