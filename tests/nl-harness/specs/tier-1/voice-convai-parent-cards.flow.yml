spec:
  name: voice-convai-parent-cards
  tier: 1
  modules: [auth, chat, content, voice]
  intent: >
    The parent voice surface is the ElevenLabs Custom-LLM endpoint
    POST /v1/parent/chat/completions. Its novel job is turning the coach's
    inline `[Title](mvp://library/{id})` markdown into a clean voice
    experience: speak the label, NEVER let the URL reach TTS, and emit a
    non-terminal `show_article` / `show_community_post` tool-call delta so the
    iOS client renders the card. This flow proves that contract against a live
    turn — the probe stays healthy, auth is enforced, the SSE framing is
    OpenAI-shaped, no `mvp://` ever lands in spoken text, and any card tool
    that fires has a parseable id and finish_reason null (a terminal
    finish_reason would cut the coach off mid-sentence).

  personas:
    parent:
      preset: existing_parent

  preconditions:
    - "OPENAI_API_KEY is set on the backend (a real coaching turn runs)"
    - "ELEVENLABS_CONVAI_SECRET is set on the backend AND exported to the harness process — the flow self-skips otherwise"
    - "RUN_OPENAI_FLOWS=true — the live turn spends model tokens"

  invariants:
    - "A request with no elevenlabs_extra_body (the console probe) returns 200 with a valid OpenAI SSE stub and a terminal `data: [DONE]`"
    - "A wrong shared secret returns 401; the legacy X-ElevenLabs-Secret header authenticates the same as Authorization: Bearer"
    - "elevenlabs_extra_body carrying only user_id is COMPLETE for the parent agent (no kid_name — the asymmetry with the kid endpoint is deliberate)"
    - "elevenlabs_extra_body present but missing user_id returns 400"
    - "Every streamed frame is a `chat.completion.chunk` and the stream ends with `data: [DONE]`"
    - "No spoken content delta ever contains `mvp://` — a URL read aloud is the failure this endpoint exists to prevent"
    - "Every tool-call delta names show_article or show_community_post, carries JSON arguments with a non-empty `id`, and has finish_reason null"
    - "The turn produces at least one spoken content delta (the coach actually answered)"

  cleanup:
    - "The persona's DELETE /family/{user_id} cascades; the voice thread is server-side conversation state under the same user_id"

  boundary_contracts:
    - endpoint: POST /v1/parent/chat/completions
      as: elevenlabs
      streaming: true
      status: 200

    - endpoint: POST /v1/parent/chat/completions
      as: anonymous
      status: 401

    - endpoint: POST /v1/parent/chat/completions
      as: elevenlabs
      status: 400
