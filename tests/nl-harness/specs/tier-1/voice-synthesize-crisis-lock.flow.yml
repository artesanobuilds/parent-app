spec:
  name: voice-synthesize-crisis-lock
  tier: 1
  modules: [auth, kid_agent, moderation, voice]
  intent: >
    When a kid agent is crisis-locked, /voice/synthesize must 403 — even
    for the previously-valid (reply_id, fragment_id) pair that was emitted
    before the lock landed. The crisis-replacement message is deliberately
    voiced via SystemTTSProvider on iOS; the backend must not happily serve
    ElevenLabs audio for a locked agent. This is a safety-critical guard.

  personas:
    parent:
      preset: kid-agent-parent

  preconditions:
    - "OPENAI_API_KEY is set on the backend"
    - "Backend's moderation patterns include the crisis phrase used in this test"
    - "Kid agent is configured with voice_mode=true"

  invariants:
    - "A clean /kid-chat message yields a (reply_id, fragment_id) pair"
    - "Calling /voice/synthesize for that pair succeeds (200) before any crisis input"
    - "A self-harm input on the same agent triggers a crisis lock (kid_agent_crisis_locks row inserted)"
    - "After the lock lands, GET /voice/synthesize/{old_reply_id}/{old_fragment_id} returns 403"
    - "The 403 fires before any provider call — fallback_reason absent or crisis-shaped, never quota/network"

  boundary_contracts:
    - endpoint: POST /kid-chat
      as: parent
      streaming: true
      status: 200

    - endpoint: GET /voice/synthesize/{reply_id}/{fragment_id}
      as: parent
      status: 200

    - endpoint: GET /kid-agent/crisis-locks
      as: parent
      status: 200
      response_includes: [locks]

    - endpoint: GET /voice/synthesize/{reply_id}/{fragment_id}
      as: parent
      status: 403
