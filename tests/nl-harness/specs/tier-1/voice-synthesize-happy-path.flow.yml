spec:
  name: voice-synthesize-happy-path
  tier: 1
  modules: [auth, consent, kid_agent, voice]
  intent: >
    A parent sets up a kid agent in voice_mode, the kid sends a message,
    /kid-chat emits one or more `voice_fragment` SSE events (each carrying
    `{reply_id, fragment_id, text, order}`), and GET
    /voice/synthesize/{reply_id}/{fragment_id} with the kid_pin returns 200
    audio/mpeg with the X-Voice-Complete: 1 trailer and a non-trivial mp3
    body. This is the resource-id-shaped contract iOS plays against.

  personas:
    parent:
      preset: kid-agent-parent

  preconditions:
    - "OPENAI_API_KEY is set on the backend (kid-chat requires it)"
    - "ELEVENLABS_API_KEY is set on the backend (otherwise the endpoint 503s with fallback_reason=key_missing)"
    - "Kid agent is configured with voice_mode=true so /kid-chat emits voice_fragment events"

  invariants:
    - "/kid-chat in voice_mode emits >=1 SSE event of type=voice_fragment with id, text, reply_id, order"
    - "GET /voice/synthesize/{reply_id}/{fragment_id} with X-Kid-Pin returns 200"
    - "Response Content-Type is audio/mpeg"
    - "Response carries X-Voice-Complete: 1 header on clean completion"
    - "Response body is non-empty mp3 bytes (>= 256 bytes — smaller would suggest a stream abort)"
    - "Subsequent identical request still returns 200 (endpoint is idempotent on the fragment id)"

  boundary_contracts:
    - endpoint: POST /kid-chat
      as: parent
      streaming: true
      status: 200

    - endpoint: GET /voice/synthesize/{reply_id}/{fragment_id}
      as: parent
      status: 200
      response_headers:
        Content-Type: audio/mpeg
        X-Voice-Complete: "1"
