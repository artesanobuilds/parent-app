spec:
  name: community-post-and-reply
  tier: 1
  modules: [auth, community]
  intent: >
    An existing parent creates a community post under a category, the post
    shows up in the category-filtered list and in the unfiltered list, the
    parent replies to it, and the reply appears in the post's replies list.
    Auth is required for writes.

  personas:
    author:
      preset: existing-parent

  preconditions: []

  invariants:
    - "Authenticated POST /content/community/new returns the created post with id/category/title/preview"
    - "GET /content/community returns the created post"
    - "GET /content/community?category=<id> returns the post when filtered by its category"
    - "POST /content/community/{post_id}/replies appends a reply with the expected body"
    - "GET /content/community/{post_id}/replies returns the new reply"
    - "Unauthenticated POST /content/community/new returns 401 (auth gate landed 2026-07)"
    - "Unauthenticated POST /content/community/{post_id}/replies returns 401"

  boundary_contracts:
    - endpoint: POST /content/community/new
      as: parent
      status: 200
      response_includes: [id, category, title, preview]

    - endpoint: POST /content/community/new
      as: anonymous
      status: 401

    - endpoint: GET /content/community
      as: anonymous
      status: 200
      response_array_min_length: 1

    - endpoint: POST /content/community/{post_id}/replies
      as: parent
      status: 200
      response_includes: [id, post_id, body]

    - endpoint: GET /content/community/{post_id}/replies
      as: anonymous
      status: 200
      response_array_min_length: 1
