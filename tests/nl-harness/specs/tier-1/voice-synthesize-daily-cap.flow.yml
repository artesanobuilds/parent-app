spec:
  name: voice-synthesize-daily-cap
  tier: 1
  modules: [auth, voice, cost_controls]
  intent: >
    Per-user daily char cap (VOICE_DAILY_CHAR_CAP_PER_USER) must reject
    /voice/synthesize with 429 + fallback_reason=quota once exceeded —
    NOT 401, NOT 500, NOT a silent drop to SystemTTSProvider. This is the
    cost-containment gate that defends against leaked-PIN replay attacks
    (Google L8 #1). Requires an admin endpoint to seed tts_usage_daily
    near the cap so we don't have to actually burn through 50k chars.

  personas:
    parent:
      preset: kid-agent-parent
    admin:
      preset: admin

  preconditions:
    - "OPENAI_API_KEY is set on the backend"
    - "ADMIN_TOKEN is set on both the harness and backend envs (admin assertions skip otherwise)"
    - "Backend exposes an admin helper POST /admin/voice/usage-bump that adds chars to tts_usage_daily for a user_id (the test seeds the user near-cap rather than burning 50k real chars). If absent, this spec skips."
    - "Kid agent is configured with voice_mode=true"

  invariants:
    - "Before any seeding, /voice/synthesize for a fresh reply/fragment returns 200"
    - "Admin POST /admin/voice/usage-bump for {user_id} with `chars` close to VOICE_DAILY_CHAR_CAP_PER_USER returns 200"
    - "After the bump, /voice/synthesize for the same parent returns 429"
    - "429 body is JSON with `detail.fallback_reason == \"quota\"` and `detail.scope == \"user\"`"
    - "The 429 fires before any provider call — no ElevenLabs spend on a capped user"
    - "Other parents (not bumped) still get 200 on their own fragments — the cap is per-user"

  boundary_contracts:
    - endpoint: POST /kid-chat
      as: parent
      streaming: true
      status: 200

    - endpoint: GET /voice/synthesize/{reply_id}/{fragment_id}
      as: parent
      status: 200

    - endpoint: POST /admin/voice/usage-bump
      as: admin
      status: 200

    - endpoint: GET /voice/synthesize/{reply_id}/{fragment_id}
      as: parent
      status: 429
      response_includes: [detail]
