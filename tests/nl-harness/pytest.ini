[pytest]
testpaths = flows
asyncio_mode = auto
markers =
    tier1: critical-path flows; always run on every push
    tier2: important flows; run on affected MRs + nightly
    tier3: nice-to-have flows; nightly only
    sse: flow exercises an SSE stream (kid-chat, /chat)
    readonly_safe: flow makes no writes; safe against the production env
    requires_admin_token: flow needs ADMIN_TOKEN env var set
    requires_openai: flow hits an endpoint that calls OpenAI
filterwarnings =
    ignore::DeprecationWarning
