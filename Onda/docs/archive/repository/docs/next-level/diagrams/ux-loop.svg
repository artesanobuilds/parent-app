<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480"><rect width="1500" height="480" fill="#ece8df"/><text x="60" y="80" font-family="Georgia,serif" font-size="40" fill="#242f2d">Notice more. Assume less.</text><text x="60" y="118" font-family="Arial,sans-serif" font-size="17" fill="#586661">A child is more than a hard moment</text><rect x="60" y="180" width="250" height="145" rx="16" fill="#fbfaf6"/><text x="82" y="230" font-family="Georgia,serif" font-size="25" fill="#245a52">Notice</text><text x="82" y="270" font-family="Arial,sans-serif" font-size="16" fill="#242f2d">A concrete episode</text><text x="316" y="260" font-size="25" fill="#586661">→</text><rect x="340" y="180" width="250" height="145" rx="16" fill="#fbfaf6"/><text x="362" y="230" font-family="Georgia,serif" font-size="25" fill="#245a52">Understand</text><text x="362" y="270" font-family="Arial,sans-serif" font-size="16" fill="#242f2d">Their interests + context</text><text x="596" y="260" font-size="25" fill="#586661">→</text><rect x="620" y="180" width="250" height="145" rx="16" fill="#fbfaf6"/><text x="642" y="230" font-family="Georgia,serif" font-size="25" fill="#245a52">Review</text><text x="642" y="270" font-family="Arial,sans-serif" font-size="16" fill="#242f2d">Parent checks evidence</text><text x="876" y="260" font-size="25" fill="#586661">→</text><rect x="900" y="180" width="250" height="145" rx="16" fill="#fbfaf6"/><text x="922" y="230" font-family="Georgia,serif" font-size="25" fill="#245a52">Try or observe</text><text x="922" y="270" font-family="Arial,sans-serif" font-size="16" fill="#242f2d">One optional next step</text><text x="1156" y="260" font-size="25" fill="#586661">→</text><rect x="1180" y="180" width="250" height="145" rx="16" fill="#fbfaf6"/><text x="1202" y="230" font-family="Georgia,serif" font-size="25" fill="#245a52">Reconsider</text><text x="1202" y="270" font-family="Arial,sans-serif" font-size="16" fill="#242f2d">Outcome, skip, contradiction</text><text x="60" y="410" font-family="Arial,sans-serif" font-size="15" fill="#586661">Sources remain visible. Interpretations stay changeable. Health, raw chat and unreviewed notes stay out of shared briefs.</text></svg>