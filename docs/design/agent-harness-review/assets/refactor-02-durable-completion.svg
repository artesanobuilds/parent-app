<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Durable before done</title><desc id="desc">Before: Success could outrun persistence. After: Persistence gates success. Tokens still stream incrementally. Failed finalization withholds the successful completion marker.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#147C72"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B45C45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3D689A"/></marker></defs><rect width="1500" height="820" fill="#F6F7F4"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="48" y="47" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">MVP  /  HARNESS ENGINEERING</text><text x="48" y="102" font-size="43" fill="#193341" font-weight="750" text-anchor="start">Durable before done</text><text x="48" y="143" font-size="24" fill="#536775" font-weight="450" text-anchor="start">Agent-turn completion follows durable finalization.</text><text x="1450" y="104" font-size="78" fill="#D0DEDA" font-weight="750" text-anchor="end">02</text><rect x="48" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="76" y="207" width="100" height="34" rx="17" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="126.0" y="231" font-size="17" fill="#B45C45" font-weight="750" text-anchor="middle">BEFORE</text><text x="76" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Success could outrun persistence</text><rect x="772" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="800" y="207" width="100" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="850.0" y="231" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">AFTER</text><text x="800" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Persistence gates success</text><text x="48" y="785" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Tokens still stream incrementally. Failed finalization withholds the successful completion marker.</text><rect x="108" y="318" width="560" height="74" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="108" y="334" width="4" height="42" rx="2" fill="#3D689A"/><text x="388.0" y="364.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Stream response tokens</text><path d="M388,392 L388,430" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="108" y="440" width="560" height="84" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="108" y="456" width="4" height="52" rx="2" fill="#B45C45"/><text x="388.0" y="491.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Send [DONE] to client</text><path d="M388,524 L388,597" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#rust)"/><rect x="188" y="544" width="400" height="35" rx="10" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="388" y="570" font-size="19" fill="#B45C45" font-weight="750" text-anchor="middle">DISCONNECT / CRASH WINDOW</text><rect x="108" y="607" width="560" height="73" rx="16" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="108" y="623" width="4" height="41" rx="2" fill="#B45C45"/><text x="388.0" y="652.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Save transcript afterward</text><rect x="832" y="318" width="560" height="74" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="832" y="334" width="4" height="42" rx="2" fill="#3D689A"/><text x="1112.0" y="364.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Stream response tokens</text><path d="M1112,392 L1112,430" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="832" y="440" width="560" height="84" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="832" y="456" width="4" height="52" rx="2" fill="#147C72"/><text x="1112.0" y="491.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Commit final transcript</text><path d="M1112,524 L1112,597" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="1020" y="544" width="184" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="1112.0" y="568" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">COMMITTED</text><rect x="832" y="607" width="560" height="73" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="832" y="623" width="4" height="41" rx="2" fill="#147C72"/><text x="1112.0" y="652.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Send [DONE] to client</text></g></svg>
