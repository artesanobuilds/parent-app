<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">Proposed turn lifecycle and failure recovery</title><desc id="desc">A mutation and its receipt commit together in DuckDB before its result is checkpointed in SQLite. If execution fails between those operations, the harness reconciles the receipt rather than replaying the mutation. Transcript persistence precedes the unchanged completion marker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#167A73"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#167A73"/></marker></defs>
<rect width="1440" height="1280" fill="#F4F7F8"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="54" y="54" font-size="17" fill="#167A73" font-weight="700">MVP  /  PROPOSED EXECUTION LIFECYCLE</text><text x="54" y="104" font-size="38" fill="#182D3A" font-weight="700">A durable business effect is not a checkpoint.</text><text x="54" y="146" font-size="23" fill="#526675" font-weight="400">The harness must reconcile the gap between two independently committed stores.</text><rect x="53" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="65" y="224" font-size="20" fill="#182D3A" font-weight="650">Client adapter</text><path d="M149 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><rect x="273" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="285" y="224" font-size="20" fill="#182D3A" font-weight="650">Execution service</text><path d="M369 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><rect x="493" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="505" y="224" font-size="20" fill="#182D3A" font-weight="650">LangGraph</text><path d="M589 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><rect x="713" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="725" y="224" font-size="20" fill="#182D3A" font-weight="650">Domain commands</text><path d="M809 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><rect x="933" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="945" y="224" font-size="20" fill="#182D3A" font-weight="650">DuckDB</text><path d="M1029 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><rect x="1153" y="185" width="192" height="62" rx="12" fill="#E9F2FA" stroke="#BED3E8"/><text x="1165" y="224" font-size="20" fill="#182D3A" font-weight="650">SQLite</text><path d="M1249 248 V1064" stroke="#CCD8DE" stroke-width="2" stroke-dasharray="5 7"/><text x="159" y="290" font-size="18" fill="#526675" font-weight="400">Authenticated turn</text><path d="M149,302 L369,302" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="280" y="330" width="396" height="75" rx="12" fill="#E6F3EF" stroke="#A9CFC4"/><text x="296" y="360" font-size="20" fill="#182D3A" font-weight="650">Acquire thread ownership</text><text x="296" y="389" font-size="19" fill="#526675" font-weight="400">Reconcile receipts, then repair</text><text x="379" y="439" font-size="18" fill="#526675" font-weight="400">Execute with run context</text><path d="M369,451 L589,451" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="502" font-size="18" fill="#526675" font-weight="400">Validated tool call</text><path d="M589,514 L809,514" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="819" y="560" font-size="18" fill="#526675" font-weight="400">Mutation + receipt</text><path d="M809,572 L1029,572" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="946" y="589" width="260" height="52" rx="10" fill="#E6F3EF" stroke="#A9CFC4"/><text x="960" y="623" font-size="17" fill="#167A73" font-weight="700">ONE DB TRANSACTION</text><text x="819" y="668" font-size="18" fill="#526675" font-weight="400">Committed result</text><path d="M1029,680 L809,680" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="720" font-size="18" fill="#526675" font-weight="400">Tool result</text><path d="M809,732 L589,732" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="783" font-size="18" fill="#526675" font-weight="400">Checkpoint the graph result</text><path d="M589,795 L1249,795" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="379" y="843" font-size="18" fill="#526675" font-weight="400">Approved text delta</text><path d="M589,855 L369,855" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="159" y="898" font-size="18" fill="#526675" font-weight="400">Legacy token frame</text><path d="M369,910 L149,910" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="379" y="964" font-size="18" fill="#526675" font-weight="400">Persist final transcript and run outcome</text><path d="M369,976 L1029,976" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="159" y="1031" font-size="18" fill="#526675" font-weight="400">Existing [DONE]</text><path d="M369,1043 L149,1043" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="54" y="1100" width="1332" height="132" rx="18" fill="#FFF3DF" stroke="#E4C895"/><text x="80" y="1138" font-size="18" fill="#A26C24" font-weight="700">THE FAILURE WINDOW</text><text x="80" y="1174" font-size="23" fill="#182D3A" font-weight="600">If the process stops after the DuckDB commit but before the SQLite checkpoint, recover the receipt.</text><text x="80" y="1208" font-size="21" fill="#526675" font-weight="400">Do not repeat the write. Tool loops repeat within the run; successful completion waits for durable finalization.</text></g></svg>