<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Own the turn. Fence the family.</title><desc id="desc">Before: Requests can cross each other. After: Ownership + deletion fences. Ownership is process-local. Deletion fences reject stale generations; this is not a distributed lock.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#147C72"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B45C45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3D689A"/></marker></defs><rect width="1500" height="820" fill="#F6F7F4"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="48" y="47" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">MVP  /  HARNESS ENGINEERING</text><text x="48" y="102" font-size="43" fill="#193341" font-weight="750" text-anchor="start">Own the turn. Fence the family.</text><text x="48" y="143" font-size="24" fill="#536775" font-weight="450" text-anchor="start">Coordinate overlapping work and keep deleted data from coming back.</text><text x="1450" y="104" font-size="78" fill="#D0DEDA" font-weight="750" text-anchor="end">04</text><rect x="48" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="76" y="207" width="100" height="34" rx="17" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="126.0" y="231" font-size="17" fill="#B45C45" font-weight="750" text-anchor="middle">BEFORE</text><text x="76" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Requests can cross each other</text><rect x="772" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="800" y="207" width="100" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="850.0" y="231" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">AFTER</text><text x="800" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Ownership + deletion fences</text><text x="48" y="785" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Ownership is process-local. Deletion fences reject stale generations; this is not a distributed lock.</text><rect x="80" y="316" width="248" height="74" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="332" width="4" height="42" rx="2" fill="#3D689A"/><text x="204.0" y="362.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Turn A</text><rect x="444" y="316" width="248" height="74" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="444" y="332" width="4" height="42" rx="2" fill="#3D689A"/><text x="568.0" y="362.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Turn B</text><path d="M204,390 L204,423 L386,423 L386,452" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><path d="M568,390 L568,423 L386,423" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round"/><rect x="165" y="460" width="442" height="77" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="165" y="476" width="4" height="45" rx="2" fill="#B45C45"/><text x="386.0" y="507.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Same conversation state</text><rect x="80" y="597" width="270" height="82" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="613" width="4" height="50" rx="2" fill="#B45C45"/><text x="215.0" y="647.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Delete family</text><path d="M350,638 L409,638" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#rust)"/><rect x="419" y="584" width="273" height="108" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="419" y="600" width="4" height="76" rx="2" fill="#B45C45"/><text x="439" y="620" font-size="25" fill="#193341" font-weight="650" text-anchor="start">Late write</text><text x="439" y="652" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Data can reappear</text><rect x="804" y="316" width="190" height="78" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="332" width="4" height="46" rx="2" fill="#3D689A"/><text x="899.0" y="364.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">A then B</text><path d="M994,355 L1043,355" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="1053" y="316" width="363" height="78" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="1053" y="332" width="4" height="46" rx="2" fill="#147C72"/><text x="1234.5" y="364.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Conversation gate</text><text x="804" y="448" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">FAMILY DELETION</text><rect x="804" y="470" width="612" height="77" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="486" width="4" height="45" rx="2" fill="#147C72"/><text x="1110.0" y="517.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">1  Close admission, then drain</text><path d="M1110,547 L1110,565" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="804" y="575" width="612" height="77" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="591" width="4" height="45" rx="2" fill="#147C72"/><text x="1110.0" y="622.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">2  Advance generation + delete</text><text x="804" y="684" font-size="22" fill="#536775" font-weight="450" text-anchor="start">After cascade: evict caches; purge checkpoints.</text><text x="804" y="422" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Turns serialize within the same conversation.</text><text x="804" y="714" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Refresh snapshots; retry pending cleanup.</text></g></svg>
