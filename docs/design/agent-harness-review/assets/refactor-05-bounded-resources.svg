<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Bound the work and the retained state</title><desc id="desc">Before: Limits were incomplete. After: Bounded attempts and caches. Canceling a coroutine does not kill a synchronous thread or guarantee that provider billing stops.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#147C72"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B45C45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3D689A"/></marker></defs><rect width="1500" height="820" fill="#F6F7F4"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="48" y="47" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">MVP  /  HARNESS ENGINEERING</text><text x="48" y="102" font-size="43" fill="#193341" font-weight="750" text-anchor="start">Bound the work and the retained state</text><text x="48" y="143" font-size="24" fill="#536775" font-weight="450" text-anchor="start">Make job lifetime, late writes and cache growth explicit.</text><text x="1450" y="104" font-size="78" fill="#D0DEDA" font-weight="750" text-anchor="end">05</text><rect x="48" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="76" y="207" width="100" height="34" rx="17" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="126.0" y="231" font-size="17" fill="#B45C45" font-weight="750" text-anchor="middle">BEFORE</text><text x="76" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Limits were incomplete</text><rect x="772" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="800" y="207" width="100" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="850.0" y="231" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">AFTER</text><text x="800" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Bounded attempts and caches</text><text x="48" y="785" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Canceling a coroutine does not kill a synchronous thread or guarantee that provider billing stops.</text><rect x="80" y="316" width="612" height="122" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="332" width="4" height="90" rx="2" fill="#B45C45"/><text x="100" y="352" font-size="25" fill="#193341" font-weight="650" text-anchor="start">Background work</text><text x="100" y="384" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Cancellation / timeout did not consistently</text><text x="100" y="414" font-size="23" fill="#536775" font-weight="450" text-anchor="start">fence late results from unfinished work</text><path d="M170,469 L600,469" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#rust)"/><text x="386" y="508" font-size="24" fill="#B45C45" font-weight="600" text-anchor="middle">Work can outlive the request</text><text x="80" y="558" font-size="18" fill="#B45C45" font-weight="750" text-anchor="start">RETAINED GRAPHS / CONNECTIONS</text><rect x="85" y="587" width="65" height="65" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="163" y="584" width="65" height="68" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="241" y="581" width="65" height="71" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="319" y="578" width="65" height="74" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="397" y="575" width="65" height="77" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="475" y="572" width="65" height="80" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><rect x="553" y="569" width="65" height="83" rx="8" fill="#FAEEE7" stroke="#DFBEB1" stroke-width="1.5"/><text x="80" y="700" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Growth without a consistent eviction policy</text><rect x="804" y="316" width="612" height="127" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="332" width="4" height="95" rx="2" fill="#147C72"/><text x="824" y="352" font-size="25" fill="#193341" font-weight="650" text-anchor="start">Background job attempt</text><text x="824" y="384" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Deadline + heartbeat + attempt identity</text><text x="824" y="414" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Canceled / expired attempts cannot publish late</text><text x="804" y="492" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">BOUNDED GRAPH CACHE</text><rect x="810" y="520" width="72" height="68" rx="8" fill="#E8F4EF" stroke="#B4D8CA" stroke-width="1.5"/><text x="846" y="563" font-size="24" fill="#147C72" font-weight="600" text-anchor="middle">1</text><rect x="896" y="520" width="72" height="68" rx="8" fill="#E8F4EF" stroke="#B4D8CA" stroke-width="1.5"/><text x="932" y="563" font-size="24" fill="#147C72" font-weight="600" text-anchor="middle">2</text><rect x="982" y="520" width="72" height="68" rx="8" fill="#E8F4EF" stroke="#B4D8CA" stroke-width="1.5"/><text x="1018" y="563" font-size="24" fill="#147C72" font-weight="600" text-anchor="middle">3</text><rect x="1068" y="520" width="72" height="68" rx="8" fill="#E8F4EF" stroke="#B4D8CA" stroke-width="1.5"/><text x="1104" y="563" font-size="24" fill="#147C72" font-weight="600" text-anchor="middle">4</text><rect x="1154" y="520" width="72" height="68" rx="8" fill="#E8F4EF" stroke="#B4D8CA" stroke-width="1.5"/><text x="1190" y="563" font-size="24" fill="#147C72" font-weight="600" text-anchor="middle">5</text><path d="M1255,554 L1394,554" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><text x="1328" y="601" font-size="22" fill="#147C72" font-weight="600" text-anchor="middle">Evict LRU</text><rect x="804" y="632" width="612" height="67" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="648" width="4" height="35" rx="2" fill="#3D689A"/><text x="1110.0" y="674.5" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Reuse schema-compatible checkpoint connections</text></g></svg>
