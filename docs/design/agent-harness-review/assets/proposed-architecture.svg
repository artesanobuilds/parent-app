<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1550" viewBox="0 0 1440 1550" role="img" aria-labelledby="title desc">
<title id="title">Proposed MVP agent harness</title><desc id="desc">Existing clients and routes retain their contracts. Adapters translate a common execution service into text, voice and job streams. Separate policies share durable domain services and state repositories inside the current backend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#167A73"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#167A73"/></marker></defs>
<rect width="1440" height="1550" fill="#F4F7F8"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="54" y="54" font-size="17" fill="#167A73" font-weight="700">MVP  /  BACKEND ARCHITECTURE PROPOSAL</text><text x="54" y="104" font-size="38" fill="#182D3A" font-weight="700">One execution service behind the existing API</text><text x="54" y="143" font-size="23" fill="#526675" font-weight="400">Keep the product contracts. Consolidate the execution rules.</text><rect x="54" y="178" width="420" height="102" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="198" width="5" height="62" rx="2" fill="#3565A0"/><text x="76" y="214" font-size="24" fill="#182D3A" font-weight="650">iOS app</text><text x="76" y="246" font-size="20" fill="#526675" font-weight="400">Existing requests and SSE parser</text><path d="M264.0,280 L264.0,318" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="178" width="420" height="102" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="510" y="198" width="5" height="62" rx="2" fill="#3565A0"/><text x="532" y="214" font-size="24" fill="#182D3A" font-weight="650">Parent dashboard</text><text x="532" y="246" font-size="20" fill="#526675" font-weight="400">Existing /cos and research clients</text><path d="M720.0,280 L720.0,318" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="966" y="178" width="420" height="102" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="966" y="198" width="5" height="62" rx="2" fill="#3565A0"/><text x="988" y="214" font-size="24" fill="#182D3A" font-weight="650">ElevenLabs voice</text><text x="988" y="246" font-size="20" fill="#526675" font-weight="400">Existing OpenAI-compatible stream</text><path d="M1176.0,280 L1176.0,318" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="54" y="320" width="1332" height="124" rx="18" fill="#E9F2FA" stroke="#BED3E8"/><text x="78" y="356" font-size="18" fill="#3565A0" font-weight="700">EXISTING HTTP CONTRACTS</text><text x="78" y="390" font-size="25" fill="#182D3A" font-weight="600">/chat   ·   /cos/chat   ·   /onboarding-chat   ·   /kid-chat</text><text x="78" y="421" font-size="20" fill="#526675" font-weight="400">/v1/parent/chat/completions   ·   /v1/chat/completions   ·   /research/runs*   ·   /onboarding/warmup*</text><path d="M54 478 H1386" stroke="#A3BAC5" stroke-width="2" stroke-dasharray="7 7"/><rect x="473" y="461" width="494" height="34" rx="0" fill="#F4F7F8" stroke="#F4F7F8"/><text x="489" y="486" font-size="17" fill="#526675" font-weight="650">IMPLEMENTATION CHANGES BELOW THIS LINE</text><rect x="54" y="518" width="420" height="111" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="538" width="5" height="71" rx="2" fill="#3565A0"/><text x="76" y="554" font-size="24" fill="#182D3A" font-weight="650">Text adapter</text><text x="76" y="586" font-size="20" fill="#526675" font-weight="400">Legacy token / tool / error frames</text><path d="M264.0,629 L264.0,674" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="510" y="518" width="420" height="111" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="510" y="538" width="5" height="71" rx="2" fill="#3565A0"/><text x="532" y="554" font-size="24" fill="#182D3A" font-weight="650">Voice adapter</text><text x="532" y="586" font-size="20" fill="#526675" font-weight="400">Deltas · article cards · end_call</text><path d="M720.0,629 L720.0,674" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="966" y="518" width="420" height="111" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="966" y="538" width="5" height="71" rx="2" fill="#3565A0"/><text x="988" y="554" font-size="24" fill="#182D3A" font-weight="650">Job adapter</text><text x="988" y="586" font-size="20" fill="#526675" font-weight="400">Existing progress / final / polling</text><path d="M1176.0,629 L1176.0,674" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="54" y="680" width="1332" height="215" rx="18" fill="#E6F3EF" stroke="#A9CFC4"/><text x="80" y="722" font-size="31" fill="#182D3A" font-weight="700">AgentExecutionService</text><text x="80" y="758" font-size="22" fill="#182D3A" font-weight="400">Trusted identity + run context  →  thread ownership  →  repair  →  execute  →  durable completion</text><text x="80" y="801" font-size="22" fill="#167A73" font-weight="600">One place for cancellation, deadlines, retry rules, event filtering and cost attribution</text><text x="80" y="841" font-size="20" fill="#526675" font-weight="400">Internal events only: TextDelta · ToolStarted · ToolFinished · SafetySignal · Completed · Failed</text><text x="80" y="872" font-size="19" fill="#526675" font-weight="400">Model / tool calls: LangGraph + DeepAgents → OpenAI / Tavily, with deadlines and usage accounted centrally.</text><path d="M211.5,895 L211.5,937" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="54" y="943" width="315" height="133" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="963" width="5" height="93" rx="2" fill="#167A73"/><text x="76" y="979" font-size="24" fill="#182D3A" font-weight="650">Parent</text><text x="76" y="1011" font-size="20" fill="#526675" font-weight="400">Coach + planning</text><text x="76" y="1038" font-size="20" fill="#526675" font-weight="400">Keep the flat toolset</text><path d="M550.5,895 L550.5,937" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="393" y="943" width="315" height="133" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="393" y="963" width="5" height="93" rx="2" fill="#167A73"/><text x="415" y="979" font-size="24" fill="#182D3A" font-weight="650">Onboarding</text><text x="415" y="1011" font-size="20" fill="#526675" font-weight="400">Profile interview</text><text x="415" y="1038" font-size="20" fill="#526675" font-weight="400">Shared profile schemas</text><path d="M889.5,895 L889.5,937" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="732" y="943" width="315" height="133" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="732" y="963" width="5" height="93" rx="2" fill="#A26C24"/><text x="754" y="979" font-size="24" fill="#182D3A" font-weight="650">Kid companion</text><text x="754" y="1011" font-size="20" fill="#526675" font-weight="400">Separate safety policy</text><text x="754" y="1038" font-size="20" fill="#526675" font-weight="400">Precheck → stream gate</text><path d="M1228.5,895 L1228.5,937" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1071" y="943" width="315" height="133" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="1071" y="963" width="5" height="93" rx="2" fill="#167A73"/><text x="1093" y="979" font-size="24" fill="#182D3A" font-weight="650">Research</text><text x="1093" y="1011" font-size="20" fill="#526675" font-weight="400">DeepAgents initially</text><text x="1093" y="1038" font-size="20" fill="#526675" font-weight="400">Bounded job execution</text><text x="54" y="1116" font-size="20" fill="#526675" font-weight="550">POLICIES STAY DISTINCT     ·     LangGraph stays     ·     Warmup and sync remain explicit workflows</text><path d="M384,1140 L384,1180" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1050,1140 L1050,1180" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="54" y="1186" width="642" height="148" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="1206" width="5" height="108" rx="2" fill="#167A73"/><text x="76" y="1222" font-size="24" fill="#182D3A" font-weight="650">Domain services</text><text x="76" y="1254" font-size="20" fill="#526675" font-weight="400">Profiles · planning · research scheduling</text><text x="76" y="1281" font-size="20" fill="#526675" font-weight="400">Tenant checks + validated commands</text><text x="76" y="1308" font-size="20" fill="#526675" font-weight="400">Durable write + operation receipt in one transaction</text><rect x="720" y="1186" width="666" height="148" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="720" y="1206" width="5" height="108" rx="2" fill="#167A73"/><text x="742" y="1222" font-size="24" fill="#182D3A" font-weight="650">Execution state and job control</text><text x="742" y="1254" font-size="20" fill="#526675" font-weight="400">Checkpoint repository · transcript projections</text><text x="742" y="1281" font-size="20" fill="#526675" font-weight="400">Run records · leases · cancellation · budget accounting</text><text x="742" y="1308" font-size="20" fill="#526675" font-weight="400">Keep existing history keys and transcript views</text><path d="M384,1334 L384,1380" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1050,1334 L1050,1380" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="54" y="1386" width="1332" height="91" rx="18" fill="#E9EEF2" stroke="#CAD6DE"/><text x="80" y="1424" font-size="25" fill="#182D3A" font-weight="650">Existing Railway deployment</text><text x="80" y="1455" font-size="22" fill="#526675" font-weight="400">DuckDB: domain data + additive run / receipt records       SQLite: existing LangGraph checkpoints</text><text x="54" y="1517" font-size="18" fill="#526675" font-weight="400">BLUE  Existing public contract     GREEN  Shared backend implementation     AMBER  Dedicated child safety policy</text></g></svg>