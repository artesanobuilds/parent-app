<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Idempotent database effects under replay</title><desc id="desc">Before: A missing result leaves ambiguity. After: A receipt proves what committed. Same tenant + thread + checkpointed call ID; command and arguments must match. External effects need separate guarantees.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#147C72"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B45C45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3D689A"/></marker></defs><rect width="1500" height="820" fill="#F6F7F4"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="48" y="47" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">MVP  /  HARNESS ENGINEERING</text><text x="48" y="102" font-size="43" fill="#193341" font-weight="750" text-anchor="start">Idempotent database effects under replay</text><text x="48" y="143" font-size="24" fill="#536775" font-weight="450" text-anchor="start">Recover a committed result instead of repeating the same mutation.</text><text x="1450" y="104" font-size="78" fill="#D0DEDA" font-weight="750" text-anchor="end">03</text><rect x="48" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="76" y="207" width="100" height="34" rx="17" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="126.0" y="231" font-size="17" fill="#B45C45" font-weight="750" text-anchor="middle">BEFORE</text><text x="76" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">A missing result leaves ambiguity</text><rect x="772" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="800" y="207" width="100" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="850.0" y="231" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">AFTER</text><text x="800" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">A receipt proves what committed</text><text x="48" y="785" font-size="22" fill="#536775" font-weight="450" text-anchor="start">Same tenant + thread + checkpointed call ID; command and arguments must match. External effects need separate guarantees.</text><rect x="80" y="316" width="248" height="82" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="332" width="4" height="50" rx="2" fill="#3D689A"/><text x="204.0" y="366.0" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Tool call K</text><path d="M328,357 L420,357" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="430" y="316" width="262" height="82" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="430" y="332" width="4" height="50" rx="2" fill="#B45C45"/><text x="561.0" y="366.0" font-size="24" fill="#193341" font-weight="650" text-anchor="middle">DB write commits</text><path d="M561,398 L561,442" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="80" y="450" width="612" height="100" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="466" width="4" height="68" rx="2" fill="#B45C45"/><text x="100" y="486" font-size="25" fill="#193341" font-weight="650" text-anchor="start">Process stops</text><text x="100" y="518" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Tool-result checkpoint is still missing</text><path d="M204,550 L204,594" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="80" y="604" width="248" height="76" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="620" width="4" height="44" rx="2" fill="#3D689A"/><text x="204.0" y="651.0" font-size="24" fill="#193341" font-weight="650" text-anchor="middle">Replay call K</text><path d="M328,642 L420,642" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#rust)"/><rect x="430" y="604" width="262" height="76" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="430" y="620" width="4" height="44" rx="2" fill="#B45C45"/><text x="561.0" y="651.0" font-size="24" fill="#193341" font-weight="650" text-anchor="middle">Duplicate write?</text><rect x="804" y="316" width="612" height="169" rx="18" fill="#E8F4EF" stroke="#A9CFC4" stroke-width="1.5"/><text x="826" y="351" font-size="19" fill="#147C72" font-weight="750" text-anchor="start">ONE DUCKDB TRANSACTION</text><rect x="826" y="376" width="255" height="78" rx="16" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="826" y="392" width="4" height="46" rx="2" fill="#147C72"/><text x="953.5" y="424.0" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Business mutation</text><text x="1110" y="425" font-size="32" fill="#147C72" font-weight="650" text-anchor="middle">+</text><rect x="1137" y="376" width="257" height="78" rx="16" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="1137" y="392" width="4" height="46" rx="2" fill="#147C72"/><text x="1265.5" y="424.0" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Receipt K + result</text><text x="1110" y="522" font-size="23" fill="#536775" font-weight="450" text-anchor="middle">Crash before the graph checkpoint?</text><path d="M1110,538 L1110,566" fill="none" stroke="#147C72" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="804" y="576" width="612" height="114" rx="16" fill="#E8F4EF" stroke="#DCE3E3" stroke-width="1.5"/><rect x="804" y="592" width="4" height="82" rx="2" fill="#147C72"/><text x="824" y="612" font-size="26" fill="#193341" font-weight="650" text-anchor="start">Replay K → return recorded result</text><text x="824" y="644" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Restore the missing tool result; do not write again</text></g></svg>
