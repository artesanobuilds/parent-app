<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">Current MVP harness boundaries</title><desc id="desc">Parent text and voice share the parent graph but duplicate execution loops. Named chat and COS use different thread resolution. Onboarding and kid graphs have separate policies; research has a separate worker. Persistence is split across checkpoints, transcript projections and profile memory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#167A73"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#167A73"/></marker></defs>
<rect width="1440" height="920" fill="#F4F7F8"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="54" y="54" font-size="17" fill="#167A73" font-weight="700">MVP  /  CURRENT DESIGN</text><text x="54" y="104" font-size="36" fill="#182D3A" font-weight="700">The graph is shared. The execution rules are scattered.</text><text x="54" y="143" font-size="22" fill="#526675" font-weight="400">Each surface owns some combination of repair, stream translation, retries and persistence.</text><rect x="54" y="192" width="320" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="212" width="5" height="63" rx="2" fill="#3565A0"/><text x="76" y="228" font-size="24" fill="#182D3A" font-weight="650">Parent text</text><text x="76" y="260" font-size="20" fill="#526675" font-weight="400">Active named conversation</text><path d="M374,243 L420,243" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="192" width="578" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="430" y="212" width="5" height="63" rx="2" fill="#A26C24"/><text x="452" y="228" font-size="24" fill="#182D3A" font-weight="650">server.generate_stream</text><text x="452" y="260" font-size="20" fill="#526675" font-weight="400">Per-surface execution and failure handling</text><path d="M1008,243 L1054,243" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1064" y="192" width="322" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="1064" y="212" width="5" height="63" rx="2" fill="#167A73"/><text x="1086" y="228" font-size="24" fill="#182D3A" font-weight="650">Shared parent graph</text><text x="1086" y="260" font-size="20" fill="#526675" font-weight="400">Existing runtime</text><rect x="54" y="321" width="320" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="341" width="5" height="63" rx="2" fill="#3565A0"/><text x="76" y="357" font-size="24" fill="#182D3A" font-weight="650">Planning text</text><text x="76" y="389" font-size="20" fill="#526675" font-weight="400">Legacy default conversation</text><path d="M374,372 L420,372" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="321" width="578" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="430" y="341" width="5" height="63" rx="2" fill="#A26C24"/><text x="452" y="357" font-size="24" fill="#182D3A" font-weight="650">cos._cos_chat_stream</text><text x="452" y="389" font-size="20" fill="#526675" font-weight="400">Per-surface execution and failure handling</text><path d="M1008,372 L1054,372" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1064" y="321" width="322" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="1064" y="341" width="5" height="63" rx="2" fill="#167A73"/><text x="1086" y="357" font-size="24" fill="#182D3A" font-weight="650">Shared parent graph</text><text x="1086" y="389" font-size="20" fill="#526675" font-weight="400">Existing runtime</text><rect x="54" y="450" width="320" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="470" width="5" height="63" rx="2" fill="#3565A0"/><text x="76" y="486" font-size="24" fill="#182D3A" font-weight="650">Parent voice</text><text x="76" y="518" font-size="20" fill="#526675" font-weight="400">Separate voice thread</text><path d="M374,501 L420,501" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="450" width="578" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="430" y="470" width="5" height="63" rx="2" fill="#A26C24"/><text x="452" y="486" font-size="24" fill="#182D3A" font-weight="650">parent_convai._stream_response</text><text x="452" y="518" font-size="20" fill="#526675" font-weight="400">Per-surface execution and failure handling</text><path d="M1008,501 L1054,501" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1064" y="450" width="322" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="1064" y="470" width="5" height="63" rx="2" fill="#167A73"/><text x="1086" y="486" font-size="24" fill="#182D3A" font-weight="650">Shared parent graph</text><text x="1086" y="518" font-size="20" fill="#526675" font-weight="400">Existing runtime</text><rect x="54" y="579" width="320" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="599" width="5" height="63" rx="2" fill="#3565A0"/><text x="76" y="615" font-size="24" fill="#182D3A" font-weight="650">Onboarding and kid</text><text x="76" y="647" font-size="20" fill="#526675" font-weight="400">Profile interview / moderation</text><path d="M374,630 L420,630" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="579" width="578" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="430" y="599" width="5" height="63" rx="2" fill="#A26C24"/><text x="452" y="615" font-size="24" fill="#182D3A" font-weight="650">Separate text + voice loops</text><text x="452" y="647" font-size="20" fill="#526675" font-weight="400">Per-surface execution and failure handling</text><path d="M1008,630 L1054,630" fill="none" stroke="#167A73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1064" y="579" width="322" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="1064" y="599" width="5" height="63" rx="2" fill="#167A73"/><text x="1086" y="615" font-size="24" fill="#182D3A" font-weight="650">Separate graphs</text><text x="1086" y="647" font-size="20" fill="#526675" font-weight="400">Existing runtime</text><rect x="54" y="708" width="320" height="103" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><rect x="54" y="728" width="5" height="63" rx="2" fill="#3565A0"/><text x="76" y="744" font-size="24" fill="#182D3A" font-weight="650">Research</text><text x="76" y="776" font-size="20" fill="#526675" font-weight="400">Atomic claim / progress rows</text><path d="M374,759 L420,759" fill="none" stroke="#167A73" stroke-wid