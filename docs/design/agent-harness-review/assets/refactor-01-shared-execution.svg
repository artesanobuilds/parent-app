<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Shared execution, distinct policies</title><desc id="desc">Before: Each surface owns its own loop. After: One service owns the lifecycle. REST and SSE contracts stay compatible. Surface-specific safety and presentation stay separate.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#147C72"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B45C45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3D689A"/></marker></defs><rect width="1500" height="820" fill="#F6F7F4"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="48" y="47" font-size="18" fill="#147C72" font-weight="750" text-anchor="start">MVP  /  HARNESS ENGINEERING</text><text x="48" y="102" font-size="43" fill="#193341" font-weight="750" text-anchor="start">Shared execution, distinct policies</text><text x="48" y="143" font-size="24" fill="#536775" font-weight="450" text-anchor="start">Consolidate lifecycle mechanics while keeping each surface&#x27;s behavior.</text><text x="1450" y="104" font-size="78" fill="#D0DEDA" font-weight="750" text-anchor="end">01</text><rect x="48" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="76" y="207" width="100" height="34" rx="17" fill="#FAEEE7" stroke="#FAEEE7" stroke-width="1.5"/><text x="126.0" y="231" font-size="17" fill="#B45C45" font-weight="750" text-anchor="middle">BEFORE</text><text x="76" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">Each surface owns its own loop</text><rect x="772" y="183" width="680" height="552" rx="24" fill="white" stroke="#DCE3E3" stroke-width="1.5"/><rect x="800" y="207" width="100" height="34" rx="17" fill="#E8F4EF" stroke="#E8F4EF" stroke-width="1.5"/><text x="850.0" y="231" font-size="17" fill="#147C72" font-weight="750" text-anchor="middle">AFTER</text><text x="800" y="280" font-size="29" fill="#193341" font-weight="700" text-anchor="start">One service owns the lifecycle</text><text x="48" y="785" font-size="22" fill="#536775" font-weight="450" text-anchor="start">REST and SSE contracts stay compatible. Surface-specific safety and presentation stay separate.</text><rect x="80" y="315" width="184" height="62" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="331" width="4" height="30" rx="2" fill="#3D689A"/><text x="172.0" y="355.0" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Chat</text><path d="M172,377 L172,418" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="80" y="426" width="184" height="143" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="442" width="4" height="111" rx="2" fill="#B45C45"/><text x="100" y="462" font-size="24" fill="#193341" font-weight="650" text-anchor="start">Own loop</text><text x="100" y="494" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Repair / retry</text><text x="100" y="524" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Stream / save</text><path d="M172,569 L172,614" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="294" y="315" width="184" height="62" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="294" y="331" width="4" height="30" rx="2" fill="#3D689A"/><text x="386.0" y="355.0" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Voice</text><path d="M386,377 L386,418" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="294" y="426" width="184" height="143" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="294" y="442" width="4" height="111" rx="2" fill="#B45C45"/><text x="314" y="462" font-size="24" fill="#193341" font-weight="650" text-anchor="start">Own loop</text><text x="314" y="494" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Repair / retry</text><text x="314" y="524" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Stream / save</text><path d="M386,569 L386,614" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="508" y="315" width="184" height="62" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="508" y="331" width="4" height="30" rx="2" fill="#3D689A"/><text x="600.0" y="355.0" font-size="23" fill="#193341" font-weight="650" text-anchor="middle">Onboarding</text><path d="M600,377 L600,418" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="508" y="426" width="184" height="143" rx="16" fill="#FAEEE7" stroke="#DCE3E3" stroke-width="1.5"/><rect x="508" y="442" width="4" height="111" rx="2" fill="#B45C45"/><text x="528" y="462" font-size="24" fill="#193341" font-weight="650" text-anchor="start">Own loop</text><text x="528" y="494" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Repair / retry</text><text x="528" y="524" font-size="23" fill="#536775" font-weight="450" text-anchor="start">Stream / save</text><path d="M600,569 L600,614" fill="none" stroke="#B45C45" stroke-width="3" stroke-linejoin="round" marker-end="url(#rust)"/><rect x="80" y="623" width="612" height="67" rx="16" fill="#EDF3FA" stroke="#DCE3E3" stroke-width="1.5"/><rect x="80" y="639" width="4" height="35" rx="2" fill="#3D689A"/><text x="386.0" y="665.5" font-size="25" fill="#193341" font-weight="650" text-anchor="middle">Existing graphs</text><rect x="804" y="315" width="184" height="62" rx="16" fill="