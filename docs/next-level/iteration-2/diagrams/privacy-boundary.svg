<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#eee9df"/><text x="50" y="75" font-family="Georgia,serif" font-size="38" fill="#263c36">Parent-private reflection is a separate boundary</text><rect x="50" y="150" width="400" height="230" rx="18" fill="#fbfaf6"/><text x="80" y="205" font-family="Georgia,serif" font-size="27" fill="#245e54">Private parent context</text><text x="80" y="250" font-family="Arial" font-size="19" fill="#263c36">Capacity, stress, guilt, interpretations</text><text x="80" y="292" font-family="Arial" font-size="19" fill="#263c36">Optional, purpose-limited, not shared</text><line x1="500" y1="150" x2="500" y2="430" stroke="#245e54" stroke-width="4"/><rect x="560" y="150" width="360" height="230" rx="18" fill="#fbfaf6"/><text x="585" y="205" font-family="Georgia,serif" font-size="27" fill="#245e54">Reviewed observation</text><text x="585" y="250" font-family="Arial" font-size="19" fill="#263c36">Selected context + source</text><text x="585" y="292" font-family="Arial" font-size="19" fill="#263c36">Exact preview before export</text><text x="935" y="270" font-size="30" fill="#586860">→</text><rect x="1000" y="150" width="350" height="230" rx="18" fill="#fbfaf6"/><text x="1025" y="205" font-family="Georgia,serif" font-size="27" fill="#245e54">Minimal manual brief</text><text x="1025" y="250" font-family="Arial" font-size="19" fill="#263c36">No active connector or child model</text><text x="1025" y="292" font-family="Arial" font-size="19" fill="#263c36">No recall of downstream copies</text><text x="50" y="485" font-family="Arial" font-size="21" fill="#263c36">Child perspective stays attributed and optional. Declining does not imply low trust.</text><text x="50" y="540" font-family="Arial" font-size="18" fill="#586860">In this demo, edited free text never leaves. This is a blanket block, not sensitivity classification.</text></svg>