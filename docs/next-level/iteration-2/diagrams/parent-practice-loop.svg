<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="530" viewBox="0 0 1600 530"><rect width="1600" height="530" fill="#eee9df"/><text x="50" y="75" font-family="Georgia,serif" font-size="42" fill="#263c36">Understand the moment. Practice a parent response.</text><text x="50" y="115" font-family="Arial,sans-serif" font-size="19" fill="#586860">Original proposed loop • not a therapeutic alliance measure</text><rect x="50" y="175" width="280" height="155" rx="15" fill="#fbfaf6"/><text x="68" y="230" font-family="Georgia,serif" font-size="26" fill="#245e54">Notice</text><text x="68" y="274" font-family="Arial,sans-serif" font-size="18" fill="#263c36">Observable moment</text><text x="335" y="255" font-size="26" fill="#586860">→</text><rect x="358" y="175" width="280" height="155" rx="15" fill="#fbfaf6"/><text x="376" y="230" font-family="Georgia,serif" font-size="26" fill="#245e54">Check my story</text><text x="376" y="274" font-family="Arial,sans-serif" font-size="18" fill="#263c36">Alternatives + unknowns</text><text x="643" y="255" font-size="26" fill="#586860">→</text><rect x="666" y="175" width="280" height="155" rx="15" fill="#fbfaf6"/><text x="684" y="230" font-family="Georgia,serif" font-size="26" fill="#245e54">Find my capacity</text><text x="684" y="274" font-family="Arial,sans-serif" font-size="18" fill="#263c36">Smaller is allowed</text><text x="951" y="255" font-size="26" fill="#586860">→</text><rect x="974" y="175" width="280" height="155" rx="15" fill="#fbfaf6"/><text x="992" y="230" font-family="Georgia,serif" font-size="26" fill="#245e54">Choose my response</text><text x="992" y="274" font-family="Arial,sans-serif" font-size="18" fill="#263c36">Boundary, curiosity, repair</text><text x="1259" y="255" font-size="26" fill="#586860">→</text><rect x="1282" y="175" width="280" height="155" rx="15" fill="#fbfaf6"/><text x="1300" y="230" font-family="Georgia,serif" font-size="26" fill="#245e54">Reflect</text><text x="1300" y="274" font-family="Arial,sans-serif" font-size="18" fill="#263c36">No grade or causal claim</text><text x="50" y="400" font-family="Arial,sans-serif" font-size="19" fill="#263c36">The child may disagree, remain upset, or want space. The parent may skip or need practical support.</text><text x="50" y="450" font-family="Arial,sans-serif" font-size="17" fill="#586860">Sources stay attributed. Parent-private context stays separate. Neither person becomes a fixed type or score.</text></svg>