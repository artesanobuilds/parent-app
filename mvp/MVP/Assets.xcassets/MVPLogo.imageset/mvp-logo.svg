<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Silver ring gradient -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2D4D6"/>
      <stop offset="45%" stop-color="#8C8E93"/>
      <stop offset="100%" stop-color="#D2D4D6"/>
    </linearGradient>
    <!-- Drop shadow for badge -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Silver outer ring -->
  <circle cx="250" cy="250" r="238" fill="url(#silver)" filter="url(#shadow)"/>

  <!-- Black inner circle -->
  <circle cx="250" cy="250" r="210" fill="#1E1E20"/>

