  <!-- Small gold dots -->
  <circle cx="210" cy="155" r="3" fill="#C9A84C" opacity="0.7"/>
  <circle cx="285" cy="148" r="3" fill="#C9A84C" opacity="0.7"/>
  <circle cx="150" cy="205" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="345" cy="200" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="250" cy="140" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="230" cy="270" r="2.5" fill="#C9A84C" opacity="0.7"/>
