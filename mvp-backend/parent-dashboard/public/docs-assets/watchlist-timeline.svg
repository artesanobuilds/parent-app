<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="240" rx="16" fill="#F3F0EB"/>

  <!-- timeline spine -->
  <line x1="80" y1="150" x2="840" y2="150" stroke="#8A8275" stroke-width="2"/>

  <!-- Point 1: watched -->
  <circle cx="140" cy="150" r="9" fill="#FFFFFF" stroke="#4F5D3A" stroke-width="3"/>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A1A">You tell me the date</text>
  <text x="140" y="120" text-anchor="middle" font-size="13" fill="#6F6A60">"signup opens Aug 12"</text>
  <text x="140" y="186" text-anchor="middle" font-size="13" fill="#6F6A60">watching ·</text>
  <text x="140" y="203" text-anchor="middle" font-size="13" fill="#6F6A60">on your board</text>

  <!-- Point 2: T-7 -->
  <circle cx="470" cy="150" r="9" fill="#4F5D3A"/>
  <text x="470" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A1A">7 days before</text>
  <text x="470" y="120" text-anchor="middle" font-size="13" fill="#6F6A60">heads-up: get your login,</text>
  <text x="470" y="137" text-anchor="middle" font-size="13" fill="#6F6A60">card, and calendar ready</text>
  <text x="470" y="186" text-anchor="middle" font-size="13" fill="#4F5D3A" font-weight="600">push notification</text>

  <!-- Point 3: day of -->
  <circle cx="740" cy="150" r="9" fill="#4F5D3A"/>
  <text x="740" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A1A">The day it opens</text>
  <text x="740" y="120" text-anchor="middle" font-size="13" fill="#6F6A60">before it opens —</text>
  <text x="740" y="137" text-anchor="middle" font-size="13" fill="#6F6A60">never after</text>
  <text x="740" y="186" text-anchor="middle" font-size="13" fill="#4F5D3A" font-weight="600">push notification</text>
</svg>
