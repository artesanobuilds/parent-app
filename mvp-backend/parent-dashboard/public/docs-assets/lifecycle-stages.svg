<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="300" rx="16" fill="#F3F0EB"/>

  <!-- Stage 1: Considering -->
  <g>
    <rect x="28" y="60" width="196" height="120" rx="14" fill="#FFFFFF" stroke="#E9E4DC"/>
    <text x="126" y="102" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A1A">Considering</text>
    <text x="126" y="128" text-anchor="middle" font-size="13" fill="#6F6A60">Saved ideas — decide</text>
    <text x="126" y="146" text-anchor="middle" font-size="13" fill="#6F6A60">when you're ready</text>
  </g>
  <path d="M228 120 h24" stroke="#8A8275" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: To register -->
  <g>
    <rect x="258" y="60" width="196" height="120" rx="14" fill="#FFFFFF" stroke="#E9E4DC"/>
    <text x="356" y="102" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A1A">To register</text>
    <text x="356" y="128" text-anchor="middle" font-size="13" fill="#6F6A60">You said yes —</text>
    <text x="356" y="146" text-anchor="middle" font-size="13" fill="#6F6A60">next step is signing up</text>
  </g>
  <path d="M458 120 h24" stroke="#8A8275" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Registered -->
  <g>
    <rect x="488" y="60" width="196" height="120" rx="14" fill="#FFFFFF" stroke="#E9E4DC"/>
    <text x="586" y="96" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A1A">Registered</text>
    <text x="586" y="118" text-anchor="middle" font-size="14" fill="#4F5D3A" font-weight="600">· needs action</text>
    <text x="586" y="142" text-anchor="middle" font-size="13" fill="#6F6A60">Signed up — payments,</text>
    <text x="586" y="160" text-anchor="middle" font-size="13" fill="#6F6A60">forms, prep to-dos</text>
  </g>
  <path d="M688 120 h24" stroke="#8A8275" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: All set -->
  <g>
    <rect x="718" y="60" width="174" height="120" rx="14" fill="#4F5D3A"/>
    <text x="805" y="108" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">All set</text>
    <text x="805" y="134" text-anchor="middle" font-size="13" fill="#E8EBDC">Nothing left to do</text>
  </g>

  <!-- Pass lane -->
  <path d="M126 184 v34" stroke="#C9C2B6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowlight)"/>
  <path d="M356 184 v34" stroke="#C9C2B6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowlight)"/>
  <path d="M586 184 v34" stroke="#C9C2B6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowlight)"/>
  <rect x="28" y="226" width="656" height="46" rx="12" fill="#FAF7F2" stroke="#E9E4DC"/>
  <text x="356" y="254" text-anchor="middle" font-size="14" fill="#6F6A60">Pass — from any stage. Its open to-dos are dismissed with it; reconsider anytime.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8A8275"/>
    </marker>
    <marker id="arrowlight" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C9C2B6"/>
    </marker>
  </defs>
</svg>
